<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DHARWINMART</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header Navbar -->
    <div th:replace="~{fragments/header :: navbar}"></div>

    <!-- Main Content -->
    <main class="main-content" style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
        <div class="container" style="max-width: 480px;">

            <!-- Flash / Logout Alerts -->
            <div th:if="${logoutMessage}" class="alert alert-info">
                <span th:text="${logoutMessage}">Logged out</span>
                <button class="alert-close" onclick="this.parentElement.remove()">×</button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
                <span th:text="${errorMessage}">Error message</span>
                <button class="alert-close" onclick="this.parentElement.remove()">×</button>
            </div>
            <div th:if="${successMessage}" class="alert alert-success">
                <span th:text="${successMessage}">Success message</span>
                <button class="alert-close" onclick="this.parentElement.remove()">×</button>
            </div>

            <!-- Login Card -->
            <div class="form-card" style="padding: 2.5rem 2rem; box-shadow: var(--shadow-lg);">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div class="brand-logo" style="justify-content: center; margin-bottom: 0.75rem;">
                        <span class="brand-badge">DM</span>
                        <span>DHARWINMART</span>
                    </div>
                    <h2 style="font-size: 1.45rem; font-weight: 800; color: var(--dark);">Account Sign In</h2>
                    <p style="color: var(--gray-600); font-size: 0.88rem; margin-top: 0.25rem;">
                        Log in to manage your orders or access the Admin portal
                    </p>
                </div>

                <!-- Quick Demo Login Presets -->
                <div style="background-color: var(--gray-50); border: 1px dashed var(--gray-300); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem;">
                    <span style="font-size: 0.78rem; font-weight: 700; color: var(--gray-600); text-transform: uppercase; display: block; margin-bottom: 0.5rem; text-align: center;">
                        ⚡ Quick Demo One-Click Sign In
                    </span>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                        <button type="button" class="btn btn-outline" style="font-size: 0.82rem; padding: 0.45rem;" onclick="fillCustomerDemo()">
                            👤 Customer Demo
                        </button>
                        <button type="button" class="btn btn-outline" style="font-size: 0.82rem; padding: 0.45rem; border-color: var(--primary); color: var(--primary);" onclick="fillAdminDemo()">
                            ⚙️ Admin Demo
                        </button>
                    </div>
                </div>

                <!-- Sign In Form -->
                <form th:action="@{/login}" method="post" id="loginForm">
                    <input type="hidden" name="role" id="loginRole" th:value="${selectedRole}">

                    <div class="form-group">
                        <label class="form-label" for="username">Username or Email</label>
                        <input type="text" id="username" name="username" class="form-control" 
                               placeholder="e.g. dharwin@example.com or admin" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control" 
                               placeholder="••••••••" required>
                    </div>

                    <div style="margin-top: 1.75rem;">
                        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem; font-size: 0.95rem;">
                            Sign In to DHARWINMART →
                        </button>
                    </div>
                </form>

                <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--gray-500);">
                    Academic Capstone MVP • Demo Credentials Pre-Loaded
                </div>
            </div>

            <!-- Back to Storefront Link -->
            <div style="text-align: center; margin-top: 1.25rem;">
                <a th:href="@{/}" style="font-size: 0.9rem; color: var(--gray-600); font-weight: 500;">
                    ← Back to Storefront
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:src="@{/js/main.js}"></script>
    <script>
        function fillCustomerDemo() {
            document.getElementById('username').value = 'dharwin@example.com';
            document.getElementById('password').value = 'customer123';
            document.getElementById('loginRole').value = 'CUSTOMER';
        }

        function fillAdminDemo() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
            document.getElementById('loginRole').value = 'ADMIN';
        }
    </script>
</body>
</html>
