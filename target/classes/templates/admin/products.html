<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Admin DHARWINMART</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header Navbar -->
    <div th:replace="~{fragments/header :: navbar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">

            <!-- Flash Alerts -->
            <div th:if="${successMessage}" class="alert alert-success">
                <span th:text="${successMessage}">Success message</span>
                <button class="alert-close" onclick="this.parentElement.remove()">×</button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
                <span th:text="${errorMessage}">Error message</span>
                <button class="alert-close" onclick="this.parentElement.remove()">×</button>
            </div>

            <!-- Header & Actions -->
            <div class="section-header">
                <div>
                    <h2 class="section-title">Product Inventory Management</h2>
                    <p class="section-subtitle">Create, update, monitor stock, and manage store catalog items</p>
                </div>
                <div style="display: flex; gap: 0.75rem;">
                    <a th:href="@{/admin/products/new}" class="btn btn-primary">+ Add New Product</a>
                    <a th:href="@{/admin}" class="btn btn-secondary">← Back to Dashboard</a>
                </div>
            </div>

            <!-- Products Table -->
            <div class="data-table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 60px;">ID</th>
                            <th style="width: 80px;">Image</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th style="width: 180px; text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td th:text="${product.id}">1</td>
                            <td>
                                <img th:src="${product.imageUrl}" th:alt="${product.name}" 
                                     style="width: 50px; height: 50px; object-fit: cover; border-radius: var(--radius-sm); background: var(--gray-100);">
                            </td>
                            <td>
                                <strong th:text="${product.name}" style="color: var(--dark); display: block;">Product Name</strong>
                                <span style="font-size: 0.8rem; color: var(--gray-500); max-width: 320px; display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                                      th:text="${product.description}">Short description</span>
                            </td>
                            <td>
                                <span class="card-badge-category" style="position: static; font-size: 0.75rem;" th:text="${product.category}">Category</span>
                            </td>
                            <td style="font-weight: 700; color: var(--dark);" th:text="'₹' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                            <td>
                                <span th:if="${product.stock > 0}" style="color: var(--accent-hover); font-weight: 700;" th:text="${product.stock}">10</span>
                                <span th:if="${product.stock <= 0}" style="color: var(--danger); font-weight: 700;">0 (Out of Stock)</span>
                            </td>
                            <td style="text-align: center;">
                                <div style="display: inline-flex; gap: 0.5rem;">
                                    <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-outline" style="padding: 0.35rem 0.65rem; font-size: 0.8rem;">
                                        ✏️ Edit
                                    </a>
                                    <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post" style="margin: 0;"
                                          onsubmit="return confirmAction(event, 'Are you sure you want to delete this product?');">
                                        <button type="submit" class="btn btn-outline" style="padding: 0.35rem 0.65rem; font-size: 0.8rem; color: var(--danger); border-color: #fca5a5;">
                                            🗑️ Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
